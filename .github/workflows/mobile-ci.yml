# =============================================================================
# ParkiPay — Mobile CI
#
# Runs on every push / PR that touches mobile/** on develop, and on any
# PR targeting main (so a manually-opened develop -> main PR shows these
# same checks before you merge it yourself).
# Pipeline:  lint  →  type-check  →  test
#
# No job in this workflow touches `main` — PRs into main are opened and
# merged manually once all checks are green.
# =============================================================================

name: Mobile CI

on:
  push:
    branches: [develop]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "mobile/**"

defaults:
  run:
    working-directory: mobile
    shell: bash

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ── TypeScript ────────────────────────────────────────────────────────────
  type-check:
    name: Type Check (tsc)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict type check
        run: npm run type-check

  # ── Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Test (Jest)
    runs-on: ubuntu-latest
    needs: [lint, type-check]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-coverage
          path: mobile/coverage/
          retention-days: 14
