# =============================================================================
# ParkiPay — Mobile CI
#
# Runs on every push / PR that touches mobile/** on the develop branch.
# Pipeline:  lint  →  type-check  →  test  →  merge-to-main
#
# Required secrets  (Settings → Secrets → Actions):
#   GH_PAT   Personal Access Token — scopes: repo, workflow
# =============================================================================

name: Mobile CI

on:
  push:
    branches: [develop]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "mobile/**"

defaults:
  run:
    working-directory: mobile
    shell: bash

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ── TypeScript ────────────────────────────────────────────────────────────
  type-check:
    name: Type Check (tsc)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict type check
        run: npm run type-check

  # ── Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Test (Jest)
    runs-on: ubuntu-latest
    needs: [lint, type-check]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-coverage
          path: mobile/coverage/
          retention-days: 14

  # ── Promote develop → main via PR + auto-merge (ruleset-compliant) ───────
  promote-to-main:
    name: Promote develop → main (PR + auto-merge)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [lint, type-check, test]
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Open (or reuse) develop → main PR and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          number=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')

          if [ -z "$number" ]; then
            if gh pr create \
              --base main --head develop \
              --title "chore: promote develop → main" \
              --body "Automated promotion — mobile CI passed on develop @ ${{ github.sha }}."
            then
              number=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')
            else
              echo "gh pr create failed (likely a race with backend-ci's promote job) — re-checking..."
              number=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')
            fi
          fi

          if [ -z "$number" ]; then
            echo "::error::Could not find or create a develop → main PR"
            exit 1
          fi

          echo "Using PR #$number"
          gh pr merge "$number" --auto --merge
