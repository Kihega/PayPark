# =============================================================================
# ParkiPay — Backend CI
#
# Runs on every push / PR that touches backend/** on develop, and on any
# PR targeting main (so a manually-opened develop -> main PR shows these
# same checks before you merge it yourself).
# Pipeline:  lint  →  security-audit  →  test
#
# No job in this workflow touches `main` — PRs into main are opened and
# merged manually once all checks are green.
# =============================================================================

name: Backend CI

on:
  push:
    branches: [develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "backend/**"

defaults:
  run:
    working-directory: backend
    shell: bash

# Cancel any in-progress run for the same branch / PR
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ── Security Audit ────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit (npm audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit for high/critical vulnerabilities
        # Fails the build on high or critical severity CVEs only
        run: npm audit --audit-level=high

  # ── Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Test (Jest + Prisma)
    runs-on: ubuntu-latest
    needs: [lint, security-audit]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       parkipay_test
          POSTGRES_USER:     parkipay
          POSTGRES_PASSWORD: parkipay
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV:     test
      DATABASE_URL: postgresql://parkipay:parkipay@localhost:5432/parkipay_test
      JWT_SECRET:   ci-test-secret-not-for-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 14
