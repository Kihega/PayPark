# =============================================================================
# ParkiPay — Backend CI
#
# Runs on every push / PR that touches backend/** on the develop branch.
# Pipeline:  lint  →  security-audit  →  test  →  merge-to-main
#
# Required secrets  (Settings → Secrets → Actions):
#   GH_PAT   Personal Access Token — scopes: repo, workflow
# =============================================================================

name: Backend CI

on:
  push:
    branches: [develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "backend/**"

defaults:
  run:
    working-directory: backend
    shell: bash

# Cancel any in-progress run for the same branch / PR
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ── Security Audit ────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit (npm audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit for high/critical vulnerabilities
        # Fails the build on high or critical severity CVEs only
        run: npm audit --audit-level=high

  # ── Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Test (Jest + Prisma)
    runs-on: ubuntu-latest
    needs: [lint, security-audit]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       parkipay_test
          POSTGRES_USER:     parkipay
          POSTGRES_PASSWORD: parkipay
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV:     test
      DATABASE_URL: postgresql://parkipay:parkipay@localhost:5432/parkipay_test
      JWT_SECRET:   ci-test-secret-not-for-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 14

  # ── Promote develop → main via PR + auto-merge (ruleset-compliant) ───────
  promote-to-main:
    name: Promote develop → main (PR + auto-merge)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [lint, security-audit, test]
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Open (or reuse) develop → main PR and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          number=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')

          if [ -z "$number" ]; then
            if gh pr create \
              --base main --head develop \
              --title "chore: promote develop → main" \
              --body "Automated promotion — backend CI passed on develop @ ${{ github.sha }}."
            then
              number=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')
            else
              echo "gh pr create failed (likely a race with mobile-ci's promote job) — re-checking..."
              number=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // empty')
            fi
          fi

          if [ -z "$number" ]; then
            echo "::error::Could not find or create a develop → main PR"
            exit 1
          fi

          echo "Using PR #$number"
          gh pr merge "$number" --auto --merge
